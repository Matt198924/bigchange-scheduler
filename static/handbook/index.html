<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A"><title>Company Handbook – R&amp;S Services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/incident/common.css">
<style>
.wrap{max-width:860px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg,#F3F6FA);padding:.6rem 0 .5rem}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding:.5rem 0 .2rem;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.35rem .75rem;font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer;color:var(--ink-2)}
.res{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin:.4rem 0 1rem;overflow:hidden}
.hit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:.7rem 1rem;cursor:pointer;font:inherit}
.hit:last-child{border-bottom:0}.hit b{font:600 12px 'IBM Plex Mono',monospace;color:var(--slate)}
.hit span{display:block;margin-top:.2rem;line-height:1.45;font-size:14px}
mark{background:#FFF1A8;padding:0 1px;border-radius:2px}
.pg{background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 .8rem;box-shadow:var(--shadow);scroll-margin-top:110px;min-height:300px}
.pg img{display:block;width:100%;height:auto;border-radius:6px}.pg.flash{outline:3px solid #00C2FF}
.pn{font:500 12px 'IBM Plex Mono',monospace;color:var(--slate);margin:.2rem 0 .3rem}
.meta{display:flex;justify-content:space-between;gap:.5rem;font:500 12px 'IBM Plex Mono',monospace;color:var(--slate);margin:.2rem 0 .3rem}
.meta a{color:var(--ink-2)}
</style></head><body>
<div class="topbar"><div class="brand"><div class="brand-mark"><img src="/static/logo-mark.png" alt="R&amp;S"></div><span class="brand-name">Company Handbook</span></div><a class="btn-home" href="/">⌂ Home</a></div>
<div class="wrap">
  <div class="bar">
    <input id="q" type="search" placeholder="Search the handbook (e.g. sick pay, holiday, vehicle)..." autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div id="res"></div>
  <div class="meta"><span id="ver"></span><a href="/static/handbook/handbook.pdf" download="RS-Employee-Handbook.pdf">Download PDF</a></div>
  <div id="pages"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TOC = [['Introduction',2],['Your employment',3],['Remuneration',5],['Holidays',6],['Absence & lateness',7],['Behaviour at work',11],['Email & internet',15],['Equal opportunities',18],['Harassment & bullying',20],['Whistleblowing',23],['Disciplinary',25],['Capability',30],['Grievance',32],['Driving vehicles',34],['Termination',37],['Rights to deduct',38]];
let PAGES = [];
function go(n) {
  const el = $('pg' + n); if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800);
}
function search() {
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(t => t.length > 1), out = [];
  if (!terms.length) { $('res').innerHTML = ''; return; }
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  PAGES.forEach((t, i) => {
    const low = t.toLowerCase();
    if (!terms.every(w => low.includes(w))) return;
    const at = Math.max(0, low.indexOf(terms[0]) - 70);
    const snip = (at ? '…' : '') + t.slice(at, at + 220) + '…';
    out.push(`<button class="hit" data-p="${i + 1}"><b>PAGE ${i + 1}</b><span>${esc(snip).replace(re, '<mark>$1</mark>')}</span></button>`);
  });
  $('res').innerHTML = `<div class="res">${out.length ? out.slice(0, 15).join('') : '<div class="hit">Nothing matches that search.</div>'}</div>`;
}
$('res').addEventListener('click', e => { const b = e.target.closest('.hit[data-p]'); if (b) go(+b.dataset.p); });
$('chips').innerHTML = TOC.map(([t, p]) => `<button class="chip" data-p="${p}">${esc(t)}</button>`).join('');
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.p); });
$('q').addEventListener('input', search);
fetch('/static/handbook/pages.json').then(r => r.json()).then(j => {
  PAGES = j.pages; $('ver').textContent = 'Employee Handbook ' + j.issue;
  $('pages').innerHTML = PAGES.map((_, i) => { const n = String(i + 1).padStart(2, '0');
    return `<div class="pg" id="pg${i + 1}"><img loading="lazy" src="/static/handbook/pages/p-${n}.jpg" alt="Handbook page ${i + 1}"></div>`; }).join('');
}).catch(() => { $('pages').innerHTML = '<div class="err">Could not load the handbook - try again.</div>'; });
</script></body></html>
