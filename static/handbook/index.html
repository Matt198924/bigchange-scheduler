<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A"><title>Company Handbook – R&amp;S Services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/incident/common.css">
<style>
.wrap{max-width:820px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:.6rem;box-shadow:var(--shadow);overflow:hidden}
.sec summary{list-style:none;cursor:pointer;padding:.9rem 1rem;font-weight:600;font-size:16px;display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.sec summary::-webkit-details-marker{display:none}.sec summary::after{content:'+';font-size:22px;color:var(--cyan);font-weight:400}.sec[open] summary::after{content:'–'}
.sec[open] summary{border-bottom:1px solid var(--line);background:var(--cyan-bg)}
.body{padding:.4rem 1rem 1rem;line-height:1.6}.body p{margin-top:.7rem}.body h3{font-size:15px;margin-top:1.1rem;color:var(--ink-2)}.body ul,.body ol{margin:.6rem 0 0 1.3rem}.body li{margin-top:.3rem}.body a{color:var(--ink-2)}
mark{background:#FFF1A8;padding:0 1px;border-radius:2px}
.ver{font:500 12px 'IBM Plex Mono',monospace;color:var(--slate);margin:.2rem 0 .9rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--slate)}
@media print{.topbar,.noprint{display:none!important}.sec{box-shadow:none}.sec .body{display:block}}
</style></head><body>
<div class="topbar"><div class="brand"><div class="brand-mark"><img src="/static/logo-mark.png" alt="R&amp;S"></div><span class="brand-name">Company Handbook</span></div><a class="btn-home" href="/">⌂ Home</a></div>
<div class="wrap">
  <div class="ver" id="ver"></div>
  <input id="q" type="search" placeholder="Search the handbook..." autocomplete="off" class="noprint" style="margin-bottom:1rem">
  <div id="list"><p class="muted">Loading...</p></div>
</div>
<script src="/static/handbook/render.js"></script>
<script>
let SECS = [];
const $ = id => document.getElementById(id);
function mark(html, terms) { return terms.length ? html.replace(new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![^<]*>)', 'gi'), '<mark>$1</mark>') : html; }
function draw() {
  const terms = $('q').value.toLowerCase().split(/\s+/).filter(t => t.length > 1);
  const shown = SECS.filter(s => terms.every(t => (s.title + ' ' + s.body).toLowerCase().includes(t)));
  $('list').innerHTML = shown.length ? shown.map(s => `<details class="sec" ${terms.length || SECS.length === 1 ? 'open' : ''}><summary>${mark(hbEsc(s.title), terms)}</summary><div class="body">${mark(hbRender(s.body), terms)}</div></details>`).join('')
    : `<div class="empty">${SECS.length ? 'Nothing matches that search.' : 'The handbook has not been added yet.'}</div>`;
}
fetch('/api/handbook').then(r => r.json()).then(j => { SECS = j.sections; $('ver').textContent = j.version; draw(); })
  .catch(() => { $('list').innerHTML = '<div class="err">Could not load the handbook - try again.</div>'; });
$('q').addEventListener('input', draw);
</script></body></html>
