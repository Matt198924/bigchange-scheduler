<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A"><title>Sign in – R&amp;S Staff Hub</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/incident/common.css">
<style>
html,body{min-height:100vh}
body{background:#071E36;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 50% at 8% 0%,rgba(0,194,255,.30),transparent 60%),
   radial-gradient(50% 45% at 100% 100%,rgba(0,194,255,.22),transparent 60%),
   linear-gradient(135deg,transparent 0 46%,rgba(0,194,255,.10) 46.2% 46.6%,transparent 46.8% 100%),
   linear-gradient(135deg,transparent 0 62%,rgba(0,194,255,.07) 62.2% 62.5%,transparent 62.7% 100%),
   linear-gradient(180deg,#0B2A4A,#061A2E)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 40%,#000,transparent)}
.topbar{display:none}
.wrap{position:relative;z-index:1;max-width:420px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.1rem}
.logo-wide{position:relative;margin:0 -5.5rem 1rem;padding:4.6rem 6.6rem;background:radial-gradient(ellipse closest-side at center,rgba(255,255,255,.94) 0,rgba(255,255,255,.88) 45%,rgba(255,255,255,.6) 68%,rgba(255,255,255,.26) 86%,rgba(255,255,255,0) 100%);filter:drop-shadow(0 0 22px rgba(0,194,255,.28))}
.logo-wide img{display:block;width:100%;height:auto}
@media(max-width:520px){.logo-wide{margin:0 -1.4rem 1rem;padding:3.8rem 3.4rem}}
.logo{width:92px;height:92px;border-radius:22px;background:#fff;padding:14px;margin:0 auto 1.1rem;display:block;box-shadow:0 0 0 6px rgba(255,255,255,.08),0 12px 40px rgba(0,194,255,.35)}
h1{text-align:center;font-size:28px;font-weight:600;color:#fff;letter-spacing:-.01em}
.sub{text-align:center;color:rgba(255,255,255,.65);margin:.35rem 0 1.5rem;font-size:14px}
.card{border:1px solid rgba(255,255,255,.10);border-top:3px solid var(--cyan);border-radius:18px;padding:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate)}
.card input,.card select{background:#F7F9FB}
.btn.primary{background:linear-gradient(180deg,#123A63,#0B2A4A);box-shadow:inset 0 -3px 0 var(--cyan),0 6px 16px rgba(11,42,74,.35);transition:transform .12s}
.btn.primary:hover{transform:translateY(-1px)}
.lnk{display:block;text-align:center;margin-top:1rem;color:var(--ink-2);font-size:13px;background:none;border:0;cursor:pointer;width:100%}
.foot{text-align:center;color:rgba(255,255,255,.45);font-size:12px;margin-top:1.4rem}
</style>
</head><body>
<div class="topbar"><div class="brand"><div class="brand-mark"><img src="/static/logo-mark.png" alt="R&amp;S"></div><span class="brand-name">Staff Hub</span></div></div>
<div class="wrap">
  <div class="logo-wide"><img src="/static/logo-wide.png" alt="R&amp;S Services (Yorkshire) Ltd"></div><h1>Sign in</h1><p class="sub">Staff Hub</p>
  <form class="card" id="emp" onsubmit="go(event)">
    <label for="who">Your name</label><select id="who"></select>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" placeholder="4-6 digit PIN">
    <div class="hint">Don't have a PIN? Ask the office.</div>
    <div id="err"></div>
    <button class="btn primary" style="width:100%;margin-top:1rem" id="btn">Sign in</button>
    <button type="button" class="lnk" onclick="swap(true)">Office sign-in</button>
  </form>
  <form class="card hidden" id="off" onsubmit="go(event, true)">
    <label for="pw">Office password</label><input id="pw" type="password" autocomplete="current-password">
    <div id="err2"></div>
    <button class="btn primary" style="width:100%;margin-top:1rem">Sign in as office</button>
    <button type="button" class="lnk" onclick="swap(false)">Staff sign-in</button>
  </form>
  <p class="foot">Staff access only</p>
</div>
<script>
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const next = (() => { const n = new URLSearchParams(location.search).get('next') || '/'; return n.startsWith('/') && !n.startsWith('//') ? n : '/'; })();
function swap(office) { $('emp').classList.toggle('hidden', office); $('off').classList.toggle('hidden', !office); }
fetch('/api/hub/me').then(r => r.json()).then(j => { if (j.signedIn) location.replace(next); });
fetch('/api/leave/employees').then(r => r.json()).then(j => { $('who').innerHTML = j.employees.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join(''); });
async function go(e, office) {
  e.preventDefault(); const box = office ? 'err2' : 'err'; $(box).innerHTML = '';
  try {
    const r = await fetch('/api/hub/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(office ? {admin: true, password: $('pw').value} : {employeeId: +$('who').value, pin: $('pin').value})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Could not sign in');
    sessionStorage.setItem('leaveToken', j.leaveToken); sessionStorage.setItem('leaveRole', j.role);
    location.replace(next);
  } catch (x) { $(box).innerHTML = `<div class="err">${esc(x.message)}</div>`; }
}
</script></body></html>
