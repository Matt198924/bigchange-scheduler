<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R&amp;S Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2A4A;
  --ink-2:#123A63;
  --cyan:#00C2FF;
  --paper:#F6F7F6;
  --surface:#FFFFFF;
  --slate:#5B6B7A;
  --amber:#F5A623;
  --moss:#2F9E44;
  --rust:#E5484D;
  --line:#E2E6E7;
  --amber-bg:#FEF3E0;
  --moss-bg:#EAF6EC;
  --rust-bg:#FCEAEA;
  --cyan-bg:#E6F9FF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

/* ── TOPBAR ─────────────────────────────────────────── */
.topbar{
  background:var(--ink);
  padding:0 1.5rem;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:2px solid var(--cyan);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:38px;height:38px;border-radius:8px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:4px;
}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-name{font-size:14px;font-weight:600;color:#fff;letter-spacing:0.01em;}
.brand-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(255,255,255,0.55);margin-left:6px;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.conn-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px;
  background:rgba(0,194,255,0.15);color:var(--cyan);
  display:flex;align-items:center;gap:5px;
}
.conn-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);}
.conn-badge.error{background:rgba(229,72,77,0.18);color:#FF8A8D;}
.conn-badge.error::before{background:#FF8A8D;}
.btn-refresh{
  padding:6px 13px;border:1px solid rgba(255,255,255,0.25);border-radius:7px;
  background:transparent;color:rgba(255,255,255,0.85);font-size:12px;font-weight:500;
  cursor:pointer;transition:background 0.15s, border-color 0.15s;
}
.btn-refresh:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.4);}
.btn-refresh:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

/* ── METRICS ────────────────────────────────────────── */
.metrics{
  display:flex;gap:1px;background:var(--line);
  border-bottom:1px solid var(--line);
  overflow-x:auto;
}
.metric{
  flex:1;min-width:108px;background:var(--surface);
  padding:14px 1rem 12px;
  border-top:3px solid var(--line);
}
.metric.c-red{border-top-color:var(--rust);}
.metric.c-blue{border-top-color:var(--ink);}
.metric.c-cyan{border-top-color:var(--cyan);}
.metric.c-green{border-top-color:var(--moss);}
.metric.c-amber{border-top-color:var(--amber);}
.m-label{font-size:10.5px;color:var(--slate);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
.m-value{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:var(--ink);line-height:1;}
.m-value.red{color:var(--rust);}
.m-value.green{color:var(--moss);}
.m-value.amber{color:#B8730E;}
.m-value.blue{color:var(--ink-2);}

/* ── SAME SITE VIEW ─────────────────────────────────── */
#samesite-view{padding:1.5rem;overflow-y:auto;height:calc(100vh - 106px);}
.section-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;
  color:var(--slate);text-transform:uppercase;margin-bottom:4px;
}
.section-sub{font-size:13px;color:var(--slate);margin-bottom:1.25rem;}
.section-sub b{color:var(--ink);font-weight:600;}

.spinner{
  width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--cyan);
  border-radius:50%;animation:spin 0.8s linear infinite;margin:2.5rem auto;display:block;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-state{
  padding:3rem 2rem;text-align:center;color:var(--slate);font-size:13px;
  background:var(--surface);border:1px dashed var(--line);border-radius:10px;
}

/* Route-strip match card — signature element */
.match-card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  margin-bottom:14px;overflow:hidden;
}
.match-head{
  padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
.match-pin{font-size:13px;}
.match-site{font-size:12.5px;font-weight:600;color:var(--ink);}
.match-site.flagged{color:var(--flag-text);}
.match-body{
  display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(240px,1.4fr);
  align-items:stretch;
}
@media (max-width:760px){.match-body{grid-template-columns:1fr;}}

.unassigned-col{padding:14px 16px;border-right:1px solid var(--line);}
@media (max-width:760px){.unassigned-col{border-right:none;border-bottom:1px solid var(--line);}}
.tag-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--rust);margin-bottom:6px;
}
.job-ref{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink);}
.job-desc{font-size:13px;font-weight:500;margin:3px 0 8px;line-height:1.4;white-space:normal;word-break:break-word;}
.chip-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;
}
.chip-dur{background:var(--cyan-bg);color:#0A7A9C;}
.chip-type{background:var(--paper);color:var(--slate);border:1px solid var(--line);}

/* Route (dashed) rail between columns */
.route-rail{
  display:flex;align-items:center;justify-content:center;
  padding:0 10px;background:var(--surface);position:relative;
}
.route-rail::before{
  content:'';position:absolute;left:50%;top:14px;bottom:14px;
  border-left:2px dashed var(--line);
}
@media (max-width:760px){
  .route-rail{padding:10px 0;height:36px;}
  .route-rail::before{left:14px;right:14px;top:50%;bottom:auto;border-left:none;border-top:2px dashed var(--line);}
}
.route-van{
  font-size:15px;background:var(--ink);color:var(--cyan);
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  z-index:1;position:relative;
}

.scheduled-col{padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.tag-eyebrow.on-site{color:var(--moss);}
.stop-row{
  display:flex;align-items:center;gap:9px;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;
}
.stop-info{flex:1;min-width:0;}
.stop-eng{font-size:12.5px;font-weight:600;color:var(--ink);}
.stop-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--slate);margin-top:1px;}
.status-pill{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.03em;
  padding:2px 8px;border-radius:20px;flex-shrink:0;text-transform:uppercase;
}
.status-ok{background:var(--moss-bg);color:#1E7A31;}
.status-issue{background:var(--amber-bg);color:#B8730E;}
.status-live{background:var(--cyan-bg);color:#0A7A9C;}

/* Per-flag colour variants — set on .match-card, inherited down */
.match-card.flag-red{--flag-bg:#FCEAEA;--flag-text:#B3272B;}
.match-card.flag-green{--flag-bg:#EAF6EC;--flag-text:#1E7A31;}
.match-card.flag-orange{--flag-bg:#FEF3E0;--flag-text:#B8730E;}
.match-card.flag-lime{--flag-bg:#F2F8DE;--flag-text:#5E7A0B;}
.match-card.flag-blue{--flag-bg:#E6F1FB;--flag-text:#185FA5;}

.flag-badge{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  padding:2px 8px;border-radius:20px;
  background:var(--flag-bg);color:var(--flag-text);
  margin-left:auto;flex-shrink:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.flag-detail{
  display:none;
  padding:6px 16px;
  background:var(--flag-bg);
  border-bottom:1px solid var(--line);
  font-size:9.5px;letter-spacing:0.02em;color:var(--flag-text);
  font-family:'IBM Plex Mono',monospace;
}
.flag-detail .flag-pill{
  display:inline-block;padding:2px 8px;border-radius:20px;
  background:rgba(0,0,0,0.08);
}

/* Assign buttons */
.btn-assign{
  font-family:'IBM Plex Sans',sans-serif;
  padding:6px 12px;border-radius:6px;border:1px solid var(--ink);
  background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;
  cursor:pointer;flex-shrink:0;white-space:nowrap;
  transition:background 0.15s, transform 0.1s;
}
.btn-assign:hover{background:var(--ink-2);}
.btn-assign:active{transform:scale(0.97);}
.btn-assign:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.btn-assign.full{width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn-assign.full:hover{background:var(--cyan-bg);border-color:var(--cyan);}

/* ── TOAST ──────────────────────────────────────────── */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:8px;
  font-size:13px;opacity:0;transition:opacity 0.25s,transform 0.25s;
  pointer-events:none;z-index:2000;
  font-family:'IBM Plex Sans',sans-serif;
}
#toast.show{opacity:1;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}
}

  <div class="metric c-cyan"><div class="m-label">In progress</div><div class="m-value blue mono" id="m-today-active">—</div></div>
  <div class="metric c-red"><div class="m-label">Yet to start</div><div class="m-value red mono" id="m-today-pending">—</div></div>
  <div class="metric c-blue"><div class="m-label">Engineers tomorrow</div><div class="m-value blue mono" id="m-engs">—</div></div>
  <div class="metric c-blue"><div class="m-label">Jobs tomorrow</div><div class="m-value blue mono" id="m-tomorrow">—</div></div>
</div>

<div id="samesite-view">
  <div class="section-eyebrow">Same-site opportunities</div>
  <div class="section-sub" id="samesite-sub">Unassigned jobs at addresses where an engineer is already booked.</div>
  <div id="samesite-content"><div class="spinner"></div></div>
</div>

<div id="toast"></div>

<script>
let jobs = [], schedule = {}, engNames = {}, todaySchedule = {}, todayEngNames = {};

const todayDate = new Date();
const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
document.getElementById('topbar-date').textContent =
  todayDate.toLocaleDateString('en-GB', {weekday:'short',day:'numeric',month:'short'}).toUpperCase() +
  ' · TOM ' + tomorrowDate.toLocaleDateString('en-GB', {day:'numeric',month:'short'}).toUpperCase();

// ── API ──────────────────────────────────────────────────
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.error||r.statusText); }
  return r.json();
}

function setBadge(state, text) {
  const b = document.getElementById('conn-badge');
  b.textContent = text;
  b.className = 'conn-badge' + (state==='error'?' error':'');
}

async function loadAll() {
  setBadge('loading','Loading');
  try {
    await Promise.all([
      loadJobs(),
      loadSchedule('today'),
      loadSchedule('tomorrow'),
    ]);
    setBadge('ok','Live');
  } catch(e) {
    setBadge('error','Error');
    console.error(e);
  }
  renderSameSite();
}

async function loadJobs() {
  const data = await api('/api/jobs/unassigned');
  jobs = data.jobs || [];
  document.getElementById('m-unassigned').textContent = jobs.length;
}

async function loadSchedule(day) {
  const endpoint = day === 'today' ? '/api/schedule/today' : '/api/schedule/tomorrow';
  const data = await api(endpoint);
  if (day === 'today') {
    todaySchedule = data.byEngineer || {};
    todayEngNames = data.engNames || {};
    document.getElementById('m-today-engs').textContent = Object.keys(todaySchedule).length;
    const EXCLUDED_PENDING_TYPES = ['parts to be returned', 'vehicle service/repair', 'engineer ad-hoc job / waiting / lunch'];
    const allTodayJobs = Object.values(todaySchedule).flat()
      .filter(j => (j.status||'').toLowerCase() !== 'cancelled');
    const totalToday = allTodayJobs.length;
    const completedOk = allTodayJobs.filter(j => (j.status||'').toLowerCase() === 'completedok').length;
    const completedIssues = allTodayJobs.filter(j => (j.status||'').toLowerCase() === 'completedwithissues').length;
    const active = allTodayJobs.filter(j => ['started','ontheway','suspended'].includes((j.status||'').toLowerCase())).length;
    document.getElementById('m-today-total').textContent = totalToday;
    document.getElementById('m-today-ok').textContent = completedOk;
    document.getElementById('m-today-issues').textContent = completedIssues;
    document.getElementById('m-today-active').textContent = active;
    const pending = allTodayJobs.filter(j =>
      ['new','scheduled','sent','read','accepted','refused'].includes((j.status||'').toLowerCase())
      && !EXCLUDED_PENDING_TYPES.includes((j.type||'').trim().toLowerCase())
    ).length;
    document.getElementById('m-today-pending').textContent = pending;
  } else {
    schedule = data.byEngineer || {};
    engNames = data.engNames || {};
    const total = Object.values(schedule).reduce((s,a)=>s+a.length,0);
    document.getElementById('m-engs').textContent = Object.keys(schedule).length;
    document.getElementById('m-tomorrow').textContent = total;
  }
}

// ── SAME SITE OPPORTUNITIES ─────────────────────────────
function renderSameSite() {
  const container = document.getElementById('samesite-content');
  const SHOW_STATUSES = ['new','scheduled','sent','read','accepted','refused','ontheway','started','suspended'];

  const scheduledByContact = {};
  const addJobs = (sched, names, dayLabel) => {
    Object.entries(sched).forEach(([engId, engJobs]) => {
      const engName = names[engId] || ('Engineer ' + engId);
      engJobs.forEach(j => {
        const contact = (j.client || '').trim().toLowerCase();
        if (!contact || contact === '—') return;
        if (!SHOW_STATUSES.includes((j.status||'').toLowerCase())) return;
        if (!scheduledByContact[contact]) scheduledByContact[contact] = [];
        scheduledByContact[contact].push({ ...j, engName, engId, dayLabel });
      });
    });
  };

  addJobs(todaySchedule, todayEngNames, 'Today');
  addJobs(schedule, engNames, 'Tomorrow');

  const matches = [];
  jobs.forEach(u => {
    const contact = (u.client || '').trim().toLowerCase();
    if (!contact || contact === '—') return;
    const scheduled = scheduledByContact[contact];
    if (scheduled && scheduled.length > 0) matches.push({ unassigned: u, scheduled });
  });

  document.getElementById('samesite-sub').innerHTML = matches.length
    ? '<b>' + matches.length + '</b> unassigned job' + (matches.length !== 1 ? 's' : '') + ' at a site that already has work scheduled'
    : 'Unassigned jobs at addresses where an engineer is already booked.';

  if (!matches.length) {
    container.innerHTML = '<div class="empty-state">No same-site opportunities right now — check back after the next refresh.</div>';
    return;
  }

  container.innerHTML = matches.map(m => {
    const u = m.unassigned;
    return '<div class="match-card" id="card-' + u.id + '">'
      + '<div class="flag-detail" id="flag-detail-' + u.id + '"></div>'
      + '<div class="match-head"><span class="match-pin">&#128205;</span><span class="match-site" id="site-' + u.id + '">' + escHtml(u.client) + '</span><span class="flag-badge" id="flag-' + u.id + '" style="display:none;"></span></div>'
      + '<div class="match-body">'

      // Unassigned job
      + '<div class="unassigned-col">'
      + '<div class="tag-eyebrow">Unassigned</div>'
      + '<div class="job-ref mono">' + escHtml(u.ref) + '</div>'
      + '<div class="job-desc">' + escHtml(u.desc) + '</div>'
      + '<div class="chip-row">'
      + '<span class="chip chip-dur mono">' + u.durationMins + ' min</span>'
      + '<span class="chip chip-type">' + escHtml(u.type) + '</span>'
      + '</div>'
      + m.scheduled.map(s =>
          '<button class="btn-assign full" style="margin-bottom:5px;"'
          + ' data-jobid="' + u.id + '"'
          + ' data-jobref="' + escHtml(u.ref) + '"'
          + ' data-engid="' + s.engId + '"'
          + ' data-engname="' + escHtml(s.engName) + '"'
          + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 5*60) + '"'
          + ' data-day="' + s.dayLabel.toLowerCase() + '">'
          + '&#8594; ' + escHtml(s.engName) + ' (' + s.dayLabel + ' after ' + (s.endTime ? fmtTime(s.endTime) : '?') + ')'
          + '</button>'
        ).join('')
      + '</div>'

      // Route rail
      + '<div class="route-rail"><div class="route-van">&#128666;</div></div>'

      // Scheduled jobs
      + '<div class="scheduled-col">'
      + '<div class="tag-eyebrow on-site">Already on site</div>'
      + m.scheduled.map(s => {
          const st = (s.status || '').toLowerCase();
          const pillClass = st === 'completedok' ? 'status-ok' : st === 'completedwithissues' ? 'status-issue' : 'status-live';
          return '<div class="stop-row">'
            + '<div class="stop-info">'
            + '<div class="stop-eng">' + escHtml(s.engName) + '</div>'
            + '<div class="stop-time mono">' + s.dayLabel + ' · ' + (s.startTime ? fmtTime(s.startTime) : 'TBC') + '</div>'
            + '</div>'
            + '<span class="status-pill ' + pillClass + '">' + (s.status || 'scheduled') + '</span>'
            + '<button class="btn-assign"'
            + ' data-jobid="' + u.id + '"'
            + ' data-jobref="' + escHtml(u.ref) + '"'
            + ' data-engid="' + s.engId + '"'
            + ' data-engname="' + escHtml(s.engName) + '"'
            + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 5*60) + '"'
            + ' data-day="' + s.dayLabel.toLowerCase() + '">'
            + 'Assign</button>'
            + '</div>';
        }).join('')
      + '</div>'

      + '</div></div>';
  }).join('');

  loadFlagsForMatches(matches.map(m => m.unassigned.id));
}

const flagCache = {};
async function loadFlagsForMatches(jobIds) {
  await Promise.all(jobIds.map(async id => {
    if (flagCache[id] !== undefined) {
      applyFlagBadge(id, flagCache[id]);
      return;
    }
    try {
      const data = await api('/api/jobs/' + id + '/flag');
      flagCache[id] = data.flag || null;
    } catch(e) {
      flagCache[id] = null;
    }
    applyFlagBadge(id, flagCache[id]);
  }));
}

const FLAG_COLOR_CLASS = {
  'parts received': 'flag-red',
  'parts on site': 'flag-green',
  'parts with engineer': 'flag-orange',
  'revisit required': 'flag-lime',
};
function flagColorClass(flagName) {
  return FLAG_COLOR_CLASS[(flagName||'').trim().toLowerCase()] || 'flag-blue';
}

function applyFlagBadge(jobId, flag) {
  const badge = document.getElementById('flag-' + jobId);
  const detail = document.getElementById('flag-detail-' + jobId);
  const site = document.getElementById('site-' + jobId);
  const card = document.getElementById('card-' + jobId);
  if (!badge || !flag || !flag.flagName) return;
  if (site) site.classList.add('flagged');
  if (card) card.classList.add(flagColorClass(flag.flagName));

  // Top strip: flag name pill
  if (detail) {
    detail.innerHTML = '<span class="flag-pill">\u{1F6A9} ' + escHtml(flag.flagName) + '</span>';
    detail.style.display = 'block';
  }

  // Header badge slot: comment + owner
  const commentText = [flag.comments, flag.ownerName].filter(Boolean).join(' \u2014 ');
  if (commentText) {
    badge.textContent = commentText;
    badge.title = commentText;
    badge.style.display = 'inline-block';
  }
}

// Assign button clicks via delegation
document.getElementById('samesite-view').addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-assign');
  if (!btn) return;
  const jobId   = btn.dataset.jobid;
  const jobRef  = btn.dataset.jobref;
  const engId   = btn.dataset.engid;
  const engName = btn.dataset.engname;
  const startMins = parseInt(btn.dataset.start);
  const day     = btn.dataset.day;
  assignJob(jobId, jobRef, engId, engName, startMins, day);
});

async function assignJob(jobId, jobRef, engId, engName, startMins, day) {
  const d = day === 'today' ? new Date(todayDate) : new Date(tomorrowDate);
  d.setHours(Math.floor(startMins/60), startMins%60, 0, 0);
  showToast('Assigning ' + jobRef + '...');
  try {
    await api('/api/jobs/' + jobId + '/assign', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({resourceId: engId, plannedStart: d.toISOString()})
    });
    jobs = jobs.filter(j => j.id !== jobId);
    document.getElementById('m-unassigned').textContent = jobs.length;
    showToast(jobRef + ' assigned to ' + engName);
    await loadSchedule(day);
    renderSameSite();
  } catch(err) {
    showToast('Failed: ' + err.message);
  }
}

// ── HELPERS ──────────────────────────────────────────────
function timeToMins(t) {
  if (!t) return -1;
  try {
    const d = new Date(t);
    if (!isNaN(d)) return d.getHours()*60 + d.getMinutes();
    const p = t.split(':');
    return parseInt(p[0])*60 + parseInt(p[1]||0);
  } catch(e) { return -1; }
}

function fmtTime(dt) {
  try { return new Date(dt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return dt; }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3500);
}

loadAll();
setInterval(loadAll, 120000);
</script>
</body>
</html>
