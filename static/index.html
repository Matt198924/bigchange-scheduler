<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BigChange Scheduler</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 14px; }

.topbar { background: #185FA5; padding: 0 1.5rem; height: 52px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 15px; font-weight: 600; color: #fff; }
.topbar-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-left: 12px; }
.conn-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,0.2); color: #fff; }
.conn-badge.error { background: #E24B4A; }
.btn-refresh { padding: 5px 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: 7px; background: transparent; color: #fff; font-size: 12px; cursor: pointer; }

.metrics { display: flex; gap: 1px; background: #e5e5e3; border-bottom: 1px solid #e5e5e3; }
.metric { flex: 1; background: #fff; padding: 12px 1rem; text-align: center; }
.metric .m-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.metric .m-value { font-size: 20px; font-weight: 600; color: #1a1a1a; }
.metric .m-value.blue { color: #185FA5; }
.metric .m-value.green { color: #3B6D11; }
.metric .m-value.red { color: #A32D2D; }

.btn-assign { padding: 4px 10px; border-radius: 6px; border: 1px solid #185FA5; background: #185FA5; color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0; }
.btn-assign:hover { background: #0C447C; }

.spinner { width: 20px; height: 20px; border: 2px solid #e5e5e3; border-top-color: #185FA5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 2rem auto; display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-msg { padding: 2rem; text-align: center; color: #aaa; font-size: 13px; }

#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;">
    <span class="logo">BigChange Scheduler</span>
    <span class="topbar-sub" id="topbar-date"></span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="conn-badge" id="conn-badge">Connecting...</span>
    <button class="btn-refresh" onclick="loadAll()">&#8635; Refresh</button>
  </div>
</div>

<div class="metrics">
  <div class="metric"><div class="m-label">Unassigned jobs</div><div class="m-value red" id="m-unassigned">—</div></div>
  <div class="metric"><div class="m-label">Scheduled today</div><div class="m-value blue" id="m-today-total">—</div></div>
  <div class="metric"><div class="m-label">Completed OK</div><div class="m-value green" id="m-today-ok">—</div></div>
  <div class="metric"><div class="m-label">Completed w/ issues</div><div class="m-value amber" id="m-today-issues">—</div></div>
  <div class="metric"><div class="m-label">In progress</div><div class="m-value blue" id="m-today-active">—</div></div>
  <div class="metric"><div class="m-label">Yet to start</div><div class="m-value red" id="m-today-pending">—</div></div>
  <div class="metric"><div class="m-label">Engineers today</div><div class="m-value blue" id="m-today-engs">—</div></div>
  <div class="metric"><div class="m-label">Engineers tomorrow</div><div class="m-value blue" id="m-engs">—</div></div>
  <div class="metric"><div class="m-label">Jobs tomorrow</div><div class="m-value blue" id="m-tomorrow">—</div></div>
  <div class="metric"><div class="m-label">Assigned today</div><div class="m-value green" id="m-done">0</div></div>
</div>

<div id="samesite-view" style="padding:1.25rem;overflow-y:auto;height:calc(100vh - 92px);background:#f5f5f3;">
  <div id="samesite-content"><div class="spinner"></div></div>
</div>

<div id="toast"></div>

<script>
let jobs = [], schedule = {}, engNames = {}, todaySchedule = {}, todayEngNames = {};
let assignedToday = 0;

const todayDate = new Date();
const tomorrowDate = new Date(); tomorrowDate.setDate(tomorrowDate.getDate() + 1);
document.getElementById('topbar-date').textContent =
  'Today: ' + todayDate.toLocaleDateString('en-GB', {weekday:'short',day:'numeric',month:'short'}) +
  '  |  Tomorrow: ' + tomorrowDate.toLocaleDateString('en-GB', {weekday:'long',day:'numeric',month:'long'});

// ── API ──────────────────────────────────────────────────
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.error||r.statusText); }
  return r.json();
}

function setBadge(state, text) {
  const b = document.getElementById('conn-badge');
  b.textContent = text;
  b.className = 'conn-badge' + (state==='error'?' error':'');
}

async function loadAll() {
  setBadge('loading','Loading...');
  try {
    await Promise.all([
      loadJobs(),
      loadSchedule('today'),
      loadSchedule('tomorrow'),
    ]);
    setBadge('ok','Live');
  } catch(e) {
    setBadge('error','Error');
    console.error(e);
  }
  renderSameSite();
}

async function loadJobs() {
  const data = await api('/api/jobs/unassigned');
  jobs = data.jobs || [];
  document.getElementById('m-unassigned').textContent = jobs.length;
}

async function loadSchedule(day) {
  const endpoint = day === 'today' ? '/api/schedule/today' : '/api/schedule/tomorrow';
  const data = await api(endpoint);
  if (day === 'today') {
    todaySchedule = data.byEngineer || {};
    todayEngNames = data.engNames || {};
    document.getElementById('m-today-engs').textContent = Object.keys(todaySchedule).length;
    const allTodayJobs = Object.values(todaySchedule).flat();
    const totalToday = allTodayJobs.length;
    const completedOk = allTodayJobs.filter(j => (j.status||'').toLowerCase() === 'completedok').length;
    const completedIssues = allTodayJobs.filter(j => (j.status||'').toLowerCase() === 'completedwithissues').length;
    const active = allTodayJobs.filter(j => ['started','ontheway','suspended'].includes((j.status||'').toLowerCase())).length;
    document.getElementById('m-today-total').textContent = totalToday;
    document.getElementById('m-today-ok').textContent = completedOk;
    document.getElementById('m-today-issues').textContent = completedIssues;
    document.getElementById('m-today-active').textContent = active;
    const pending = allTodayJobs.filter(j => ['new','scheduled','sent','read','accepted','refused'].includes((j.status||'').toLowerCase())).length;
    document.getElementById('m-today-pending').textContent = pending;
  } else {
    schedule = data.byEngineer || {};
    engNames = data.engNames || {};
    const total = Object.values(schedule).reduce((s,a)=>s+a.length,0);
    document.getElementById('m-engs').textContent = Object.keys(schedule).length;
    document.getElementById('m-tomorrow').textContent = total;
  }
}

// ── SAME SITE OPPORTUNITIES ─────────────────────────────
function renderSameSite() {
  const container = document.getElementById('samesite-content');
  const SHOW_STATUSES = ['new','scheduled','sent','read','accepted','refused','ontheway','started','suspended'];

  const scheduledByContact = {};
  const addJobs = (sched, names, dayLabel) => {
    Object.entries(sched).forEach(([engId, engJobs]) => {
      const engName = names[engId] || ('Engineer ' + engId);
      engJobs.forEach(j => {
        const contact = (j.client || '').trim().toLowerCase();
        if (!contact || contact === '—') return;
        if (!SHOW_STATUSES.includes((j.status||'').toLowerCase())) return;
        if (!scheduledByContact[contact]) scheduledByContact[contact] = [];
        scheduledByContact[contact].push({ ...j, engName, engId, dayLabel });
      });
    });
  };

  addJobs(todaySchedule, todayEngNames, 'Today');
  addJobs(schedule, engNames, 'Tomorrow');

  const matches = [];
  jobs.forEach(u => {
    const contact = (u.client || '').trim().toLowerCase();
    if (!contact || contact === '—') return;
    const scheduled = scheduledByContact[contact];
    if (scheduled && scheduled.length > 0) matches.push({ unassigned: u, scheduled });
  });

  if (!matches.length) {
    container.innerHTML = '<div class="empty-msg">No same-site opportunities found</div>';
    return;
  }

  container.innerHTML = '<div style="font-size:13px;color:#888;margin-bottom:1rem;">'
    + matches.length + ' unassigned job' + (matches.length !== 1 ? 's' : '') + ' at a site that already has work scheduled</div>'
    + matches.map(m => {
      const u = m.unassigned;
      return '<div style="background:#fff;border:1px solid #e5e5e3;border-radius:10px;padding:16px;margin-bottom:12px;">'
        + '<div style="font-size:12px;font-weight:600;color:#185FA5;margin-bottom:10px;">&#128205; ' + escHtml(u.client) + '</div>'
        + '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start;">'

        // Unassigned job card
        + '<div style="background:#FFF8F0;border:1px solid #FAEEDA;border-radius:8px;padding:12px;">'
        + '<div style="font-size:10px;font-weight:600;color:#854F0B;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Unassigned</div>'
        + '<div style="font-size:12px;font-weight:600;color:#185FA5;">' + escHtml(u.ref) + '</div>'
        + '<div style="font-size:13px;font-weight:500;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + escHtml(u.desc) + '</div>'
        + '<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;">'
        + '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#E6F1FB;color:#185FA5;">' + u.durationMins + ' min</span>'
        + '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#f0f0ee;color:#666;">' + escHtml(u.type) + '</span>'
        + '</div>'
        + '<div style="margin-top:10px;display:flex;flex-direction:column;gap:5px;">'
        + m.scheduled.map(s =>
            '<button class="btn-assign" style="font-size:11px;width:100%;text-align:left;padding:6px 10px;"'
            + ' data-jobid="' + u.id + '"'
            + ' data-jobref="' + escHtml(u.ref) + '"'
            + ' data-engid="' + s.engId + '"'
            + ' data-engname="' + escHtml(s.engName) + '"'
            + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 5*60) + '"'
            + ' data-day="' + s.dayLabel.toLowerCase() + '">'
            + '&#128664; Assign to ' + escHtml(s.engName) + ' (' + s.dayLabel + ' after ' + (s.endTime ? fmtTime(s.endTime) : '?') + ')'
            + '</button>'
          ).join('')
        + '</div></div>'

        // Arrow
        + '<div style="text-align:center;padding-top:24px;font-size:18px;color:#185FA5;">&#8644;</div>'

        // Scheduled jobs
        + '<div>'
        + '<div style="font-size:10px;font-weight:600;color:#3B6D11;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;">Already scheduled here</div>'
        + m.scheduled.map(s => {
            const st = (s.status || '').toLowerCase();
            const statusColor = st === 'completedok' ? '#3B6D11' : st === 'completedwithissues' ? '#854F0B' : '#185FA5';
            const statusBg    = st === 'completedok' ? '#EAF3DE' : st === 'completedwithissues' ? '#FAEEDA' : '#E6F1FB';
            return '<div style="background:#f9f9f7;border:1px solid #e5e5e3;border-radius:7px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;">'
              + '<div style="flex:1;min-width:0;">'
              + '<div style="font-size:12px;font-weight:500;">' + escHtml(s.engName) + '</div>'
              + '<div style="font-size:11px;color:#888;">' + s.dayLabel + ' · ' + (s.startTime ? fmtTime(s.startTime) : 'TBC') + '</div>'
              + '</div>'
              + '<span style="font-size:10px;padding:2px 7px;border-radius:20px;background:' + statusBg + ';color:' + statusColor + ';flex-shrink:0;">' + (s.status || 'scheduled') + '</span>'
              + '<button class="btn-assign" style="font-size:11px;flex-shrink:0;"'
              + ' data-jobid="' + u.id + '"'
              + ' data-jobref="' + escHtml(u.ref) + '"'
              + ' data-engid="' + s.engId + '"'
              + ' data-engname="' + escHtml(s.engName) + '"'
              + ' data-start="' + (s.endTime ? timeToMins(s.endTime) : s.startTime ? timeToMins(s.startTime) : 5*60) + '"'
              + ' data-day="' + s.dayLabel.toLowerCase() + '">'
              + 'Assign</button>'
              + '</div>';
          }).join('')
        + '</div>'
        + '</div></div>';
    }).join('');
}

// Assign button clicks via delegation
document.getElementById('samesite-view').addEventListener('click', function(e) {
  const btn = e.target.closest('.btn-assign');
  if (!btn) return;
  const jobId   = btn.dataset.jobid;
  const jobRef  = btn.dataset.jobref;
  const engId   = btn.dataset.engid;
  const engName = btn.dataset.engname;
  const startMins = parseInt(btn.dataset.start);
  const day     = btn.dataset.day;
  assignJob(jobId, jobRef, engId, engName, startMins, day);
});

async function assignJob(jobId, jobRef, engId, engName, startMins, day) {
  const d = day === 'today' ? new Date(todayDate) : new Date(tomorrowDate);
  d.setHours(Math.floor(startMins/60), startMins%60, 0, 0);
  showToast('Assigning ' + jobRef + '...');
  try {
    await api('/api/jobs/' + jobId + '/assign', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({resourceId: engId, plannedStart: d.toISOString()})
    });
    jobs = jobs.filter(j => j.id !== jobId);
    assignedToday++;
    document.getElementById('m-unassigned').textContent = jobs.length;
    document.getElementById('m-done').textContent = assignedToday;
    showToast(jobRef + ' assigned to ' + engName);
    await loadSchedule(day);
    renderSameSite();
  } catch(err) {
    showToast('Failed: ' + err.message);
  }
}

// ── HELPERS ──────────────────────────────────────────────
function timeToMins(t) {
  if (!t) return -1;
  try {
    const d = new Date(t);
    if (!isNaN(d)) return d.getHours()*60 + d.getMinutes();
    const p = t.split(':');
    return parseInt(p[0])*60 + parseInt(p[1]||0);
  } catch(e) { return -1; }
}

function fmtTime(dt) {
  try { return new Date(dt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return dt; }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3500);
}

loadAll();
setInterval(loadAll, 120000);
</script>
</body>
</html>
