<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=ca36ccb0-b45c-47ef-b0ef-41de4098f26b
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<meta name="description" content="Van parts stock finder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Parts</title>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark"><img src="/static/logo-mark.png" alt="R&amp;S"></div><div><div class="eyebrow">VAN STOCK</div><h1>Parts</h1></div></div>
  <div class="top-actions"><button id="refreshBtn" class="install" type="button">Reload stock</button><button id="installBtn" class="install hidden" type="button">Install app</button><a class="install home" href="/">⌂ Home</a></div>
</header>
<nav class="tabs"><button id="tabSearch" class="tab on" type="button">Search</button><button id="tabLockers" class="tab" type="button">Lockers</button><button id="tabCats" class="tab" type="button">Catalogues</button></nav>
<main id="lockersMain" class="hidden">
<section class="search-card"><div class="summary" style="margin:0 0 8px">Tap a locker to see what should be in it.</div>
<div id="lkMap" class="map-wrap"></div></section>
<section id="lkList" class="results"></section>
</main>
<main id="catsMain" class="hidden">
<section class="search-card"><label for="catQ">Search the catalogues</label>
<div class="search-row"><input id="catQ" type="search" autocomplete="off" placeholder="e.g. pilot nozzle, thermostat, FESU0391"></div>
<div id="catSum" class="summary">Supplier catalogues: tap one to browse, or search across all of them.</div></section>
<section id="catList" class="results"></section>
<section id="catView" class="hidden"><button id="catBack" class="install" type="button" style="margin:.4rem 0">‹ Back</button><div id="catPages"></div></section>
</main>
<main id="appMain">
<section class="search-card">
<label for="search">Search part number or description</label>
<div class="search-row"><input id="search" type="search" autocomplete="off" placeholder="e.g. 1013, bearing, bolt" autofocus><button id="clearBtn" class="clear" type="button" aria-label="Clear search">×</button></div>
<div class="photo-row"><button id="photoBtn" class="install" type="button">📷 Search by photo</button><input id="photoFile" type="file" accept="image/*" capture="environment" hidden></div><div id="photoOut"></div><div class="photo-row" style="margin-top:8px"><a class="install" href="returns.html" style="display:inline-block;text-decoration:none;background:#F59E0B;color:#fff;padding:11px 16px">↩ Return unwanted parts</a></div>
<div id="summary" class="summary">Loading stock…</div><div id="status" class="status" role="status" aria-live="polite"></div>
</section>
<section id="results" class="results" aria-live="polite"></section>
<section id="empty" class="empty"><div class="empty-icon">🔎</div><h2>Find a part</h2><p>Search by part number, description, or locker location.</p></section>
</main>
<div id="mapModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
<div class="modal-panel"><div class="modal-head"><div><div class="eyebrow">LOCATION</div><h2 id="mapTitle">Locker</h2></div><button id="closeMap" class="close" type="button" aria-label="Close">×</button></div>
<div id="mapWrap" class="map-wrap"></div><div class="map-bar"><div id="mapNote" class="map-note"></div></div></div></div>
<script src="config.js"></script><script src="app.js"></script><script src="catalogues.js"></script><script src="photo.js"></script>
</body></html>
