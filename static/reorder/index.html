<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B2A4A"><title>Reorder levels – R&amp;S Services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/incident/common.css">
<style>.wrap{max-width:1000px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:1rem;margin:.8rem 0}
.muted{color:var(--slate);font-size:13px}.err{color:#b00020;margin:.4rem 0}.ok{color:#0a7a3a}
.sm{padding:.4rem .8rem;border-radius:8px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}.sm.p{background:#0B2A4A;color:#fff}.sm:disabled{opacity:.5}
.loc>summary{cursor:pointer;font-weight:700;padding:.2rem 0}table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;padding:.3rem .4rem}td{padding:.3rem .4rem;border-top:1px solid #E2E6E7}
input.q{width:5.5rem}pre{background:#f3f5f6;padding:.6rem;border-radius:8px;overflow:auto;font-size:12px}</style></head><body>
<div class="topbar"><div class="brand"><div class="brand-mark"><img src="/static/logo-mark.png" alt="R&amp;S"></div><span class="brand-name">Reorder levels</span></div><a class="btn-home" href="/">⌂ Home</a></div>
<div class="wrap">
<div class="card"><h2>Add one part to every van</h2>
  <p class="muted">Search the stock system, pick the part, set the reorder level, and add it to all vans in one go.</p>
  <input id="aq" placeholder="Search part" style="width:100%" oninput="srch()"><div id="ares" class="muted" style="margin:.3rem 0"></div>
  <div id="apick" style="margin:.3rem 0"></div>
  <label>Reorder level <input id="aqty" class="q" type="number" min="1" step="1" value="1"></label>
  <label style="margin-left:1rem">Leave out vehicles containing <input id="askip" value="stock" style="width:8rem"></label>
  <div style="margin-top:.6rem"><button class="sm p" onclick="addAll()">Add to all vans</button> <span id="amsg" class="muted"></span></div></div>
<div class="card"><h2>Locations with reorder levels</h2>
  <input id="fq" placeholder="Filter locations" style="width:100%;margin-bottom:.5rem" oninput="draw()">
  <div id="summary" class="muted">Loading…</div><div id="locs"></div></div>
<div class="card"><button class="sm" onclick="check()">Check connection to BigChange</button> <input id="ceid" placeholder="Van ID (optional)" style="width:9rem"> <input id="csid" placeholder="Stock ID (optional)" style="width:9rem"> <input id="cq" placeholder="or your own: StockId=1&EntityType=2&EntityId=2" style="width:22rem;max-width:100%"> <span class="muted">Shows what BigChange sends back. Add a van ID to try asking for that van.</span><pre id="chk" style="display:none"></pre></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
async function api(path, method = 'GET', body) {
  const r = await fetch('/api/reorder' + path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = '/login?next=/reorder/'; throw new Error('Sign in again'); }
  if (!r.ok) throw new Error(j.error || 'Server problem (HTTP ' + r.status + ')');
  return j;
}
let LOCS = [], PICK = null, qcache = {};
async function load() {
  try { const j = await api('/levels'); LOCS = j.locations; $('summary').textContent = LOCS.length + ' locations, ' + j.total + ' reorder levels.'; draw(); }
  catch (e) { $('summary').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
}
function draw() {
  const q = $('fq').value.toLowerCase(); const open = new Set([...document.querySelectorAll('details.loc[open]')].map(d => d.dataset.k));
  $('locs').innerHTML = LOCS.filter(l => !q || l.label.toLowerCase().includes(q)).map(l => { const k = l.entityType + '-' + l.entityId;
    return `<details class="loc" data-k="${k}" ${open.has(k) ? 'open' : ''} ontoggle="if(this.open)quant('${k}')"><summary>${esc(l.label)} <span class="muted">${esc(l.kind)} · ${l.items.length} items</span></summary>
    <table><tr><th>Item</th><th>Reorder level</th><th>Current qty</th><th>New level</th></tr>${l.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.level}</td><td id="cq-${k}-${i.stockId}" class="muted">…</td>
    <td><input class="q" type="number" min="0" step="1" data-loc="${k}" data-stock="${i.stockId}" data-old="${i.level}" placeholder="${i.level}"></td></tr>`).join('')}</table>
    <div style="margin-top:.5rem"><button class="sm p" onclick="upd('${k}')">Update</button> <span id="um-${k}" class="muted"></span></div></details>`; }).join('');
  document.querySelectorAll('details.loc[open]').forEach(d => quant(d.dataset.k));
}
async function quant(k) {
  const [et, eid] = k.split('-');
  if (!qcache[k]) { try { qcache[k] = (await api(`/quantities?entityType=${et}&entityId=${eid}`)).quantities; } catch (e) { qcache[k] = null; } }
  const l = LOCS.find(x => x.entityType == et && x.entityId == eid); if (!l) return;
  l.items.forEach(i => { const c = $(`cq-${k}-${i.stockId}`); if (c) c.textContent = qcache[k] ? (qcache[k][i.stockId] ?? 0) : '?'; });
}
async function upd(k) {
  const [et, eid] = k.split('-'); const rows = [...document.querySelectorAll(`input.q[data-loc="${k}"]`)].filter(i => i.value !== '' && Number(i.value) !== Number(i.dataset.old));
  const msg = $('um-' + k); if (!rows.length) { msg.textContent = 'Nothing changed.'; return; }
  if (!confirm('Change ' + rows.length + ' reorder level(s) in BigChange?\n\n' + rows.map(i => i.closest('tr').children[0].textContent + ': ' + i.dataset.old + ' -> ' + i.value).join('\n'))) return;
  let bad = 0, n = 0;
  for (const i of rows) { msg.textContent = 'Updating ' + (++n) + ' of ' + rows.length + '...';
    try { const j = await api('/set', 'POST', {stockId: i.dataset.stock, entityType: et, entityId: eid, quantity: i.value}); if (j.now != null && Number(j.now) !== Number(i.value)) { bad++; i.style.outline = '2px solid #b00020'; i.title = 'BigChange now shows ' + j.now; } }
    catch (e) { bad++; i.style.outline = '2px solid #b00020'; i.title = e.message; } }
  msg.innerHTML = bad ? `<span class="err">${bad} did not end up at the value you typed (marked red) - BigChange may add to the level instead of replacing it. Reloaded the real levels.</span>` : '<span class="ok">Updated.</span>';
  qcache = {}; await load();
}
let st; function srch() { clearTimeout(st); st = setTimeout(async () => { const q = $('aq').value.trim(); if (q.length < 2) { $('ares').textContent = ''; return; }
  $('ares').textContent = 'Searching...'; try { const j = await api('/search?q=' + encodeURIComponent(q)); $('ares').innerHTML = j.results.length ? j.results.map(r => `<a href="#" onclick="pick(${r.id},this);return false" data-t="${esc(r.text)}" style="display:block;padding:.15rem 0">${esc(r.text)}</a>`).join('') : 'No match.'; } catch (e) { $('ares').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; } }, 350); }
function pick(id, a) { PICK = {id, text: a.dataset.t}; $('apick').innerHTML = '<b>Selected:</b> ' + esc(PICK.text); $('ares').textContent = ''; }
async function addAll() {
  if (!PICK) { $('amsg').textContent = 'Pick a part first.'; return; } const qty = Number($('aqty').value); if (!(qty > 0)) { $('amsg').textContent = 'Enter a quantity.'; return; }
  try { const v = (await api('/vans?skip=' + encodeURIComponent($('askip').value))).vans;
    if (!confirm(`Add "${PICK.text}" with a reorder level of ${qty} to ${v.length} vans?\n\n${v.slice(0, 40).map(x => x.name).join(', ')}${v.length > 40 ? ', ...' : ''}`)) return;
    $('amsg').textContent = 'Adding to ' + v.length + ' vans...'; const j = await api('/add-all', 'POST', {stockId: PICK.id, quantity: qty, vanIds: v.map(x => x.id)});
    $('amsg').innerHTML = `<span class="${j.failed.length ? 'err' : 'ok'}">${j.done} added${j.failed.length ? ', ' + j.failed.length + ' failed: ' + esc(j.failed[0].error) : ''}.</span>`; qcache = {}; load();
  } catch (e) { $('amsg').innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
}
async function check() { const p = $('chk'); p.style.display = 'block'; p.textContent = 'Asking BigChange...'; try { p.textContent = JSON.stringify(await api('/check?entityId=' + encodeURIComponent($('ceid').value.trim()) + '&stockId=' + encodeURIComponent($('csid').value.trim()) + '&q=' + encodeURIComponent($('cq').value.trim())), null, 1); } catch (e) { p.textContent = e.message; } }
load();
</script></body></html>
